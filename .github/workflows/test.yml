name: Tests
on: [push, pull_request]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Build VM
        run: gcc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror c4vm.c -o c4vm-test
      - name: Run tests with branch coverage
        run: python -m coverage run -m unittest discover -v
      - name: Coverage report
        run: python -m coverage report
      - name: Coverage XML
        run: python -m coverage xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python }}
          path: coverage.xml

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run VM tests with AddressSanitizer and UndefinedBehaviorSanitizer
        env:
          CFLAGS: -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all
          ASAN_OPTIONS: detect_leaks=1
        run: python -m unittest discover -v
